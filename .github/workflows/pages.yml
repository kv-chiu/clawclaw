name: Deploy GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "README.md"
      - "feed.xml"
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Build site
        run: |
          mkdir -p _site
          cp README.md _site/
          cp feed.xml _site/ 2>/dev/null || true
          cat > _site/_config.yml << 'YAML'
          theme: jekyll-theme-minimal
          title: clawclaw
          description: Awesome list of OpenClaw-inspired AI agents
          YAML

      - uses: actions/upload-pages-artifact@v3

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
